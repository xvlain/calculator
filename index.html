<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>在线计算器</title>
<meta name="description" content="简洁好用的在线计算器，支持四则运算、百分比等日常计算。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2312b7f5'/%3E%3Crect x='16' y='10' width='32' height='13' rx='3' fill='white'/%3E%3Ccircle cx='22' cy='33' r='3.4' fill='white'/%3E%3Ccircle cx='32' cy='33' r='3.4' fill='white'/%3E%3Ccircle cx='42' cy='33' r='3.4' fill='white'/%3E%3Ccircle cx='22' cy='45' r='3.4' fill='white'/%3E%3Ccircle cx='32' cy='45' r='3.4' fill='white'/%3E%3Crect x='38' y='41' width='8' height='8' rx='2' fill='white'/%3E%3C/svg%3E">
<style>
/* SECTION: base */
:root{
  --brand:#12b7f5; --brand-deep:#0ba2dd; --brand-soft:#e3f5fd;
  --radius:14px; --radius-sm:10px;
  --shadow-sm:0 1px 3px rgba(0,0,0,.06);
  --shadow-md:0 4px 12px rgba(0,0,0,.08);
  --shadow-lg:0 8px 24px rgba(0,0,0,.10);
}
html[data-theme="light"]{
  --bg:#f5f7fa; --app-bg:#f0f2f5; --panel:#ffffff; --panel-alt:#f8f9fb;
  --line:#e8ebef; --line-light:#f0f2f5;
  --txt:#1a1d23; --txt2:#6b7280; --txt3:#9ca3af;
  --bubble-other:#ffffff; --bubble-self:var(--brand);
  --sys:#f3f4f6; --sys-txt:#9ca3af;
  --key:#ffffff; --key-txt:#1a1d23; --key-fn:#f3f4f6; --key-fn-txt:#4b5563;
  --key-op:var(--brand-soft); --key-op-txt:var(--brand-deep);
  --input-bg:#f8f9fb; --input-border:#e5e7eb;
  --menu-bg:#ffffff;
}
html[data-theme="dark"]{
  --bg:#0f1114; --app-bg:#15171b; --panel:#1e2126; --panel-alt:#252830;
  --line:#2b2f36; --line-light:#1e2126;
  --txt:#e9eaec; --txt2:#9ca3af; --txt3:#6b7280;
  --bubble-other:#282c33; --bubble-self:var(--brand);
  --sys:#24272d; --sys-txt:#6b7280;
  --key:#23262c; --key-txt:#e9eaec; --key-fn:#2c3038; --key-fn-txt:#d1d5db;
  --key-op:#1a3a4d; --key-op-txt:#7dd3fc;
  --input-bg:#252830; --input-border:#374151;
  --menu-bg:#282c33;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg); color:var(--txt);
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;border:none;background:none;cursor:pointer;color:inherit}
button:disabled{opacity:.6;cursor:default}
input,select,textarea{font-family:inherit;outline:none;border:none;background:none;color:inherit}
.screen{display:none}
.screen.active{display:block}
.app{max-width:460px;margin:0 auto;min-height:100vh;min-height:100dvh;background:var(--app-bg);display:flex;flex-direction:column;position:relative}
@media (min-width:520px){
  .app{box-shadow:0 0 32px rgba(0,0,0,.08)}
}

/* SECTION: screen-calc */
#screen-calc .app{justify-content:space-between;padding:0 0 14px}
.calc-head{text-align:center;padding:28px 16px 8px}
.calc-head h1{font-size:20px;font-weight:600;letter-spacing:.5px}
.calc-head .calc-sub{font-size:12px;color:var(--txt2);margin-top:4px}
.calc-card{margin:12px 16px 0;background:var(--panel);border-radius:18px;box-shadow:var(--shadow-md);padding:18px 14px 14px}
.calc-display{padding:8px 12px 18px;text-align:right;min-height:100px;display:flex;flex-direction:column;justify-content:flex-end}
.calc-expr{font-size:14px;color:var(--txt3);min-height:20px;word-break:break-all}
.calc-out{font-size:44px;font-weight:300;line-height:1.15;word-break:break-all;font-variant-numeric:tabular-nums;transition:color .2s}
.calc-out.small{font-size:28px}
.calc-keys{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.key{
  height:56px;border-radius:12px;font-size:21px;font-weight:500;
  background:var(--key);color:var(--key-txt);box-shadow:var(--shadow-sm);
  display:flex;align-items:center;justify-content:center;
  transition:transform .05s,opacity .05s;user-select:none;
}
.key:active{transform:scale(.95);opacity:.85}
.key.fn{background:var(--key-fn);color:var(--key-fn-txt);font-size:18px}
.key.op{background:var(--key-op);color:var(--key-op-txt)}
.key.eq{background:var(--brand);color:#fff;font-size:24px}
.key.eq:active{background:var(--brand-deep)}
.key.zero{grid-column:span 2}
.calc-foot{text-align:center;font-size:11px;color:var(--txt3);padding:14px 16px 4px}
#screen-calc.unlocked .calc-out{color:var(--brand)}
#screen-calc.unlocked .app{opacity:.4;transition:opacity .3s}

/* SECTION: screen-login */
#screen-login.active{display:flex}
#screen-login{min-height:100vh;min-height:100dvh;background:linear-gradient(180deg,#e8f4fd 0%,#f5f7fa 100%)}
.login-wrap{width:100%;max-width:460px;margin:0 auto;padding:0 28px;display:flex;flex-direction:column;align-items:center}
.login-logo{width:72px;height:72px;margin-top:12vh;background:var(--panel);border-radius:20px;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-lg)}
.login-logo svg{width:44px;height:44px}
.login-wrap h2{color:var(--txt);font-size:22px;font-weight:600;margin-top:16px;letter-spacing:1px}
.login-sub{color:var(--txt2);font-size:13px;margin-top:6px}
.login-card{width:100%;background:var(--panel);border-radius:16px;padding:28px 24px 24px;margin-top:32px;box-shadow:var(--shadow-md)}
.field{margin-bottom:18px}
.field label{display:block;font-size:13px;color:var(--txt2);margin-bottom:6px;font-weight:500}
.field input,.field select{
  width:100%;height:46px;background:var(--input-bg);border-radius:10px;
  padding:0 14px;font-size:15px;border:1.5px solid transparent;
  transition:border-color .15s,background .15s;
}
.field input:focus,.field select:focus{background:var(--panel);border-color:var(--brand)}
.login-err{font-size:13px;color:#ef4444;min-height:18px;margin:4px 0 10px}
.btn-primary{
  width:100%;height:46px;border-radius:10px;background:var(--brand);color:#fff;
  font-size:16px;font-weight:600;letter-spacing:4px;text-indent:4px;
  transition:background .15s;
}
.btn-primary:active{background:var(--brand-deep)}
.login-tip{font-size:12px;color:var(--txt3);text-align:center;margin-top:16px;line-height:1.6}

/* SECTION: screen-main */
.main-app{height:100vh;height:100dvh;overflow:hidden}
#main-header{
  flex:0 0 auto;height:52px;display:flex;align-items:center;justify-content:center;
  background:var(--panel);border-bottom:1px solid var(--line);
  padding-top:env(safe-area-inset-top);
}
#main-header h2{font-size:17px;font-weight:600}
.panel{display:none;flex:1;min-height:0;flex-direction:column;background:var(--app-bg)}
.panel.active{display:flex}

/* SECTION: panel-chat */
.conv-scroll{flex:1;min-height:0;overflow-y:auto}
.conv-item{
  display:flex;align-items:center;gap:12px;padding:14px 16px;
  background:var(--panel);border-bottom:1px solid var(--line-light);
  cursor:pointer;transition:background .1s;
}
.conv-item:active{background:var(--input-bg)}
.avatar{
  width:46px;height:46px;border-radius:12px;flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:15px;font-weight:600;letter-spacing:.5px;
  overflow:hidden;
}
.avatar img{width:100%;height:100%;object-fit:cover}
.conv-info{flex:1;min-width:0}
.conv-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.conv-name{font-size:15px;font-weight:600}
.conv-time{font-size:12px;color:var(--txt3);flex:0 0 auto}
.conv-preview{font-size:13px;color:var(--txt2);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{padding:60px 30px;text-align:center;color:var(--txt2);font-size:14px;line-height:1.8}
.empty-icon{font-size:40px;margin-bottom:12px;opacity:.4}
.empty b{color:var(--brand);font-weight:600}

.room-wrap{flex:1;min-height:0;display:flex;flex-direction:column}
.room-head{
  flex:0 0 auto;display:flex;align-items:center;gap:8px;
  padding:10px 12px;background:var(--panel);border-bottom:1px solid var(--line);
}
.room-back{width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:8px}
.room-back:active{background:var(--input-bg)}
.room-back svg{width:20px;height:20px;color:var(--txt)}
.room-title{min-width:0;flex:1}
.room-name{font-size:16px;font-weight:600}
.room-status{font-size:11px;margin-top:1px}
.room-status.on{color:#10b981}
.room-status.off{color:var(--txt3)}
.msg-list{flex:1;min-height:0;overflow-y:auto;padding:12px 14px 8px}
.time-label{text-align:center;font-size:11px;color:var(--sys-txt);margin:12px 0}
.time-label span{background:var(--sys);border-radius:6px;padding:3px 10px}
.msg{display:flex;margin:10px 0}
.msg.self{justify-content:flex-end}
.bubble{
  max-width:72%;padding:10px 14px;border-radius:16px;font-size:15px;line-height:1.5;
  word-break:break-word;white-space:pre-wrap;position:relative;box-shadow:var(--shadow-sm);
}
.msg.other .bubble{background:var(--bubble-other);border-top-left-radius:4px}
.msg.self .bubble{background:var(--bubble-self);color:#fff;border-top-right-radius:4px}
.edited{font-size:10px;opacity:.6;margin-left:6px;white-space:nowrap}
.sys-msg{text-align:center;margin:10px 0;font-size:12px;color:var(--sys-txt)}
#edit-banner{
  flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  padding:8px 14px;background:var(--brand-soft);color:var(--brand-deep);font-size:13px;
  border-top:1px solid var(--line);
}
html[data-theme="dark"] #edit-banner{background:#1a3a4d;color:#7dd3fc}
#edit-cancel{color:inherit;font-size:13px;padding:4px 8px}
.input-bar{
  flex:0 0 auto;display:flex;align-items:center;gap:10px;
  padding:10px 12px calc(10px + env(safe-area-inset-bottom));
  background:var(--panel);border-top:1px solid var(--line);
}
#msg-input{
  flex:1;min-width:0;height:40px;background:var(--input-bg);border-radius:20px;
  padding:0 16px;font-size:15px;
}
.send-btn{
  flex:0 0 auto;height:40px;padding:0 18px;border-radius:20px;
  background:var(--brand);color:#fff;font-size:14px;font-weight:600;
}
.send-btn:active{background:var(--brand-deep)}

/* SECTION: panel-friends */
.add-bar{flex:0 0 auto;display:flex;gap:10px;padding:14px 16px 10px}
#add-id{
  flex:1;min-width:0;height:42px;background:var(--panel);border-radius:10px;
  padding:0 14px;font-size:15px;box-shadow:var(--shadow-sm);
}
#btn-add{
  flex:0 0 auto;height:42px;padding:0 16px;border-radius:10px;
  background:var(--brand);color:#fff;font-size:14px;font-weight:600;
}
#btn-add:active{background:var(--brand-deep)}
.friend-scroll{flex:1;min-height:0;overflow-y:auto}
.friend-item{
  display:flex;align-items:center;gap:12px;padding:12px 16px;
  background:var(--panel);border-bottom:1px solid var(--line-light);cursor:pointer;
  transition:background .1s;
}
.friend-item:active{background:var(--input-bg)}
.fi-info{flex:1;min-width:0}
.fi-name{font-size:15px;font-weight:600}
.fi-status{font-size:12px;margin-top:2px;display:flex;align-items:center;gap:5px}
.fi-status::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--txt3)}
.fi-status.on{color:#10b981}
.fi-status.on::before{background:#10b981}
.fi-status.off{color:var(--txt3)}
.friends-tip{flex:0 0 auto;font-size:12px;color:var(--txt3);text-align:center;padding:10px 20px calc(12px + env(safe-area-inset-bottom));line-height:1.7}

/* SECTION: profile-view */
.profile-overlay{
  position:fixed;top:0;left:0;right:0;bottom:0;z-index:50;
  background:var(--bg);display:none;flex-direction:column;
  max-width:460px;margin:0 auto;
}
.profile-overlay.active{display:flex}
.profile-head{
  flex:0 0 auto;display:flex;align-items:center;gap:8px;
  padding:12px;background:var(--panel);border-bottom:1px solid var(--line);
  padding-top:calc(12px + env(safe-area-inset-top));
}
.profile-back{width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:8px}
.profile-back:active{background:var(--input-bg)}
.profile-back svg{width:20px;height:20px}
.profile-content{flex:1;min-height:0;overflow-y:auto;padding:20px 16px}
.profile-card{background:var(--panel);border-radius:16px;box-shadow:var(--shadow-md);overflow:hidden}
.profile-avatar-wrap{padding:24px 0 16px;text-align:center;background:linear-gradient(135deg,var(--brand-soft) 0%,var(--panel) 100%)}
.profile-avatar{width:80px;height:80px;border-radius:50%;margin:0 auto;border:4px solid var(--panel);box-shadow:var(--shadow-md);overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:700;color:#fff}
.profile-avatar img{width:100%;height:100%;object-fit:cover}
.profile-info{padding:0 20px 20px;text-align:center}
.profile-nickname{font-size:20px;font-weight:700;margin-bottom:4px}
.profile-id{font-size:13px;color:var(--txt2)}
.profile-details{padding:16px 20px;border-top:1px solid var(--line)}
.profile-row{display:flex;justify-content:space-between;padding:10px 0;font-size:14px}
.profile-row-label{color:var(--txt2)}
.profile-row-value{font-weight:500}
.profile-actions{padding:20px;display:flex;gap:10px}
.profile-actions button{flex:1;height:44px;border-radius:10px;font-size:15px;font-weight:600}
.btn-add-friend{background:var(--brand);color:#fff}
.btn-add-friend:active{background:var(--brand-deep)}
.btn-send-msg{background:var(--panel-alt);color:var(--txt);border:1.5px solid var(--line)}
.btn-send-msg:active{background:var(--input-bg)}

/* SECTION: panel-me */
.me-scroll{flex:1;min-height:0;overflow-y:auto;padding:16px 14px 30px}
.me-card{
  display:flex;align-items:center;gap:14px;background:var(--panel);
  border-radius:var(--radius);padding:18px 16px;box-shadow:var(--shadow-md);
}
.me-avatar{width:56px;height:56px;border-radius:50%;font-size:20px;overflow:hidden}
.me-avatar img{width:100%;height:100%;object-fit:cover}
.me-name{font-size:17px;font-weight:700}
.me-id{font-size:13px;color:var(--txt2);margin-top:2px}
.me-group{background:var(--panel);border-radius:var(--radius);margin-top:14px;box-shadow:var(--shadow-sm);overflow:hidden}
.me-group-title{font-size:12px;color:var(--txt2);padding:12px 16px 6px;font-weight:600}
.me-row{
  display:flex;align-items:center;justify-content:space-between;
  padding:13px 16px;border-top:1px solid var(--line-light);font-size:14px;min-height:48px;
  cursor:pointer;transition:background .1s;
}
.me-row:first-of-type{border-top:none}
.me-row:active{background:var(--input-bg)}
.me-row .row-val{font-size:13px;color:var(--txt2)}
.pwd-form{padding:6px 16px 16px}
.pwd-form input{
  width:100%;height:42px;background:var(--input-bg);border-radius:8px;
  padding:0 12px;font-size:14px;margin-top:10px;
}
.pwd-form .btn-small{
  width:100%;height:40px;margin-top:14px;border-radius:8px;
  background:var(--brand);color:#fff;font-size:14px;font-weight:600;
}
.pwd-form .btn-small:active{background:var(--brand-deep)}
.theme-seg{display:flex;gap:8px}
.theme-seg button{
  height:30px;padding:0 14px;border-radius:8px;font-size:13px;
  background:var(--input-bg);color:var(--txt2);font-weight:500;
}
.theme-seg button.on{background:var(--brand);color:#fff}
.switch{width:44px;height:24px;border-radius:12px;background:var(--line);position:relative;flex:0 0 auto}
.switch .dot{width:20px;height:20px;border-radius:50%;background:#fff;position:absolute;top:2px;left:2px;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.switch.off{opacity:.5}
.me-logout{
  width:100%;height:46px;border-radius:var(--radius);margin-top:14px;
  background:var(--panel);color:#ef4444;font-size:14px;font-weight:600;box-shadow:var(--shadow-sm);
}
.me-logout:active{background:var(--input-bg)}

/* SECTION: edit-profile */
.edit-profile-overlay{
  position:fixed;top:0;left:0;right:0;bottom:0;z-index:50;
  background:var(--bg);display:none;flex-direction:column;
  max-width:460px;margin:0 auto;
}
.edit-profile-overlay.active{display:flex}
.ep-head{
  flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  padding:14px 16px;background:var(--panel);border-bottom:1px solid var(--line);
  padding-top:calc(14px + env(safe-area-inset-top));
}
.ep-head h3{font-size:17px;font-weight:600;flex:1;text-align:center}
.ep-back,.ep-save{width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:8px;font-size:14px;font-weight:600}
.ep-back svg{width:20px;height:20px}
.ep-save{color:var(--brand)}
.ep-content{flex:1;min-height:0;overflow-y:auto;padding:20px 16px}
.ep-avatar-section{text-align:center;margin-bottom:24px}
.ep-avatar{width:80px;height:80px;border-radius:50%;margin:0 auto 12px;border:4px solid var(--panel);box-shadow:var(--shadow-md);overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:700;color:#fff;cursor:pointer}
.ep-avatar img{width:100%;height:100%;object-fit:cover}
.ep-avatar-hint{font-size:12px;color:var(--txt3)}
.ep-field{margin-bottom:18px}
.ep-field label{display:block;font-size:13px;color:var(--txt2);margin-bottom:6px;font-weight:500}
.ep-field input,.ep-field select{
  width:100%;height:44px;background:var(--input-bg);border-radius:10px;
  padding:0 14px;font-size:15px;border:1.5px solid transparent;
  transition:border-color .15s;
}
.ep-field input:focus,.ep-field select:focus{border-color:var(--brand)}
.ep-gender-group{display:flex;gap:10px}
.ep-gender-group button{
  flex:1;height:44px;border-radius:10px;font-size:14px;font-weight:500;
  background:var(--input-bg);color:var(--txt2);border:1.5px solid transparent;
  transition:all .15s;
}
.ep-gender-group button.on{background:var(--brand-soft);color:var(--brand-deep);border-color:var(--brand)}

/* SECTION: tabbar */
.tabbar{
  flex:0 0 auto;display:flex;background:var(--panel);
  border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
.tab{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:8px 0 6px;color:var(--txt3);font-size:11px;min-height:56px;
}
.tab svg{width:24px;height:24px}
.tab.on{color:var(--brand)}
.tab span{line-height:1}

/* SECTION: overlay */
#ctx-menu{
  position:fixed;z-index:60;background:var(--menu-bg);border-radius:12px;
  box-shadow:0 8px 24px rgba(0,0,0,.15);padding:5px;min-width:110px;
}
.ctx-item{
  display:block;width:100%;text-align:left;padding:10px 14px;
  font-size:14px;border-radius:8px;color:var(--txt);
}
.ctx-item:active{background:var(--input-bg)}
.ctx-item.danger{color:#ef4444}
#toast{
  position:fixed;z-index:80;left:50%;top:14%;transform:translateX(-50%);
  background:rgba(20,24,30,.92);color:#fff;font-size:14px;
  padding:10px 20px;border-radius:24px;max-width:76vw;text-align:center;
  opacity:0;pointer-events:none;transition:opacity .2s;
}
#toast.show{opacity:1}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition:none!important;animation:none!important}
}
</style>
</head>
<body>

<!-- SECTION: screen-calc -->
<section id="screen-calc" class="screen active">
  <div class="app">
    <header class="calc-head">
      <h1>在线计算器</h1>
      <p class="calc-sub">简洁四则 · 即开即用</p>
    </header>
    <div class="calc-card">
      <div class="calc-display">
        <div class="calc-expr" id="calc-expr">&nbsp;</div>
        <div class="calc-out" id="calc-out">0</div>
      </div>
      <div class="calc-keys" id="calc-keys">
        <button class="key fn" data-key="clear" aria-label="清除">C</button>

(function(){

/* SECTION: utils */
function $(id){ return document.getElementById(id); }

function fmtClock(ts){ var d = new Date(ts); return pad(d.getHours()) + ':' + pad(d.getMinutes()); }
function fmtConvTime(ts){
  var d = new Date(ts), t = new Date();
  if(d.toDateString() === t.toDateString()) return fmtClock(ts);
  if(d.getFullYear() === t.getFullYear()) return pad(d.getMonth()+1) + '-' + pad(d.getDate());
  return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate());
}
function fmtMsgTime(ts){
  var d = new Date(ts), t = new Date();
  if(d.toDateString() === t.toDateString()) return fmtClock(ts);
  return pad(d.getMonth()+1) + '-' + pad(d.getDate()) + ' ' + fmtClock(ts);
}
function calcAge(birthday){
  if(!birthday) return null;
  var b = new Date(birthday), t = new Date();
  var age = t.getFullYear() - b.getFullYear();
  if(t.getMonth() < b.getMonth() || (t.getMonth() === b.getMonth() && t.getDate() < b.getDate())) age--;
  return age >= 0 ? age : null;
}
function calcZodiac(birthday){
  if(!birthday) return null;
  var d = new Date(birthday), m = d.getMonth() + 1, day = d.getDate();
  var signs = [
    [1,20,'摩羯座'],[2,19,'水瓶座'],[3,21,'双鱼座'],[4,20,'白羊座'],

    [9,23,'处女座'],[10,24,'天秤座'],[11,23,'天蝎座'],[12,22,'射手座']

    if(m > signs[i][0] || (m === signs[i][0] && day >= signs[i][1])) return signs[i][2];
  }
  return '摩羯座';
}
var toastTimer = null;
function toast(msg){
  var el = $('toast');
  el.textContent = msg;
  el.classList.add('show');

}
function jget(k){ try{ var v = localStorage.getItem(k); return v ? JSON.parse(v) : null; }catch(e){ return null; } }
function jset(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }

/* SECTION: supabase */
var SUPABASE_URL = 'https://qvbywrfkpbiojncikdnw.supabase.co';
var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF2Ynl3cmZrcGJpb2puY2lrZG53Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg1NzQ0MzIsImV4cCI6MjEwNDE1MDQzMn0.iv-GBbOYG3WfrdaxXaf2VZI7-groBrPjmPFrkxMHwos';

function rpc(name, params){
  if(!sb) return Promise.reject(new Error('本地预览缺少 supabase.js，请访问线上地址使用完整功能'));
  return sb.rpc(name, params).then(function(res){
    if(res.error){
      var msg = res.error.message || '请求失败';
      if(/could not find|not exist/i.test(msg) && /function/i.test(msg)){
        msg = '服务尚未初始化，请先完成数据库初始化';
      }
      throw new Error(msg);

    return res.data;
  });
}

/* SECTION: session */
function getSession(){ return jget('oc_session'); }
function setSession(s){ jset('oc_session', s); }
function clearSession(){ localStorage.removeItem('oc_session'); }
function checkSessionExpiry(){
  var s = getSession();
  if(!s) return false;
  var lastActive = s.last_active || s.login_time;
  if(!lastActive) return true;
  if(now() - lastActive > 14 * 24 * 60 * 60 * 1000){
    clearSession();
    return false;
  }
  s.last_active = now();
  setSession(s);
  return true;
}

/* SECTION: state */
var ME = null, TOKEN = null, MY_PROFILE = null;
var FRIENDS = [];
var MSG = {};
var MAX_ID = 0;
var CUR_FRIEND = null, EDIT_ID = null;
var ONLINE = {};
var HEART_TIMER = null, POLL_TIMER = null;
var netCh = null, lobbyCh = null;
var POLLING = false;
var lastTouchOpen = 0;

function convKey(a,b){ return [a,b].sort().join('|'); }
function peerOf(conv){ var p = conv.split('|'); return p[0] === ME ? p[1] : p[0]; }
function tsOf(m){ return new Date(m.created_at).getTime(); }

var TAB_TITLES = { chat:'主客厅', friends:'昏光庭院', me:'我的' };

/* SECTION: screens */
function showScreen(name){
  ['calc','login','main'].forEach(function(n){
    $('screen-' + n).classList.toggle('active', n === name);
  });
  window.scrollTo(0,0);
}

/* SECTION: calc */
var calc = { cur:'0', prev:null, op:null, fresh:true, err:false };
function fmtNum(n){
  if(!isFinite(n)) return '错误';
  var s = String(parseFloat(n.toPrecision(12)));
  if(s.length > 14) s = n.toExponential(6);
  return s;
}
function renderCalc(){
  var ex = (calc.op && calc.prev !== null) ? fmtNum(calc.prev) + ' ' + calc.op : '\u00A0';
  $('calc-expr').textContent = ex;
  $('calc-out').textContent = calc.cur;
  $('calc-out').classList.toggle('small', calc.cur.length > 10);
}
function resetCalc(){ calc.cur = '0'; calc.prev = null; calc.op = null; calc.fresh = true; calc.err = false; renderCalc(); }
function compute(a,b,op){
  if(op === '+') return a + b;
  if(op === '−') return a - b;
  if(op === '×') return a * b;
  if(op === '÷') return b === 0 ? null : a / b;
  return null;
}
function digit(d){
  if(calc.err) resetCalc();
  if(calc.fresh){ calc.cur = (d === '.') ? '0.' : d; calc.fresh = false; }
  else{
    if(d === '.' && calc.cur.indexOf('.') >= 0) return;
    if(calc.cur === '0' && d !== '.') calc.cur = d;
    else{
      if(calc.cur.length >= 15) return;
      calc.cur += d;
    }
  }
  renderCalc();
}
function chooseOp(op){
  if(calc.err) return;
  var v = parseFloat(calc.cur);
  if(calc.prev !== null && calc.op && !calc.fresh){
    var r = compute(calc.prev, v, calc.op);
    if(r === null){ divZero(); return; }
    calc.prev = r;
    calc.cur = fmtNum(r);
  }else if(calc.prev === null || calc.op === null){
    calc.prev = v;
  }
  calc.op = op;
  calc.fresh = true;
  renderCalc();
}
function divZero(){
  calc.cur = '除数不能为0';
  calc.prev = null; calc.op = null; calc.fresh = true; calc.err = true;
  renderCalc();
}
function equals(){
  if(calc.err) return;
  if(!calc.op && !calc.fresh && calc.cur === '1314'){ unlock(); return; }
  if(calc.op && calc.prev !== null){
    var v = parseFloat(calc.cur);
    var r = compute(calc.prev, v, calc.op);
    if(r === null){ divZero(); return; }
    $('calc-expr').textContent = fmtNum(calc.prev) + ' ' + calc.op + ' ' + fmtNum(v) + ' =';
    calc.cur = fmtNum(r);
    calc.prev = null; calc.op = null; calc.fresh = true;
    $('calc-out').textContent = calc.cur;
    $('calc-out').classList.toggle('small', calc.cur.length > 10);
    return;
  }
  calc.fresh = true;
  renderCalc();
}
function back(){
  if(calc.err){ resetCalc(); return; }
  if(calc.fresh) return;
  calc.cur = calc.cur.length > 1 ? calc.cur.slice(0,-1) : '0';
  if(calc.cur === '') calc.cur = '0';
  renderCalc();
}
function percent(){
  if(calc.err) return;
  calc.cur = fmtNum(parseFloat(calc.cur) / 100);
  calc.fresh = false;
  renderCalc();
}
function unlock(){
  var sc = $('screen-calc');
  sc.classList.add('unlocked');
  setTimeout(function(){
    sc.classList.remove('unlocked');
    renderCalc();
    if(checkSessionExpiry()){
      var s = getSession();
      if(s && s.uid && s.token) openMain(s.uid);
      else showScreen('login');
    }else{
      showScreen('login');
      setTimeout(function(){ $('login-id').focus(); }, 80);
    }
  }, 420);
}
$('calc-keys').addEventListener('click', function(e){
  var btn = e.target.closest('.key');
  if(!btn) return;
  var k = btn.dataset.key;
  if(k === 'digit') digit(btn.dataset.digit);
  else if(k === 'dot') digit('.');
  else if(k === 'op') chooseOp(btn.dataset.op);
  else if(k === 'equals') equals();
  else if(k === 'clear') resetCalc();
  else if(k === 'back') back();
  else if(k === 'percent') percent();
});
document.addEventListener('keydown', function(e){
  if(!$('screen-calc').classList.contains('active')) return;
  var k = e.key;
  if(k >= '0' && k <= '9') digit(k);
  else if(k === '.') digit('.');
  else if(k === '+') chooseOp('+');
  else if(k === '-') chooseOp('−');
  else if(k === '*' || k === 'x' || k === 'X') chooseOp('×');
  else if(k === '/'){ e.preventDefault(); chooseOp('÷'); }
  else if(k === 'Enter' || k === '='){ e.preventDefault(); equals(); }
  else if(k === 'Backspace') back();
  else if(k === 'Escape') resetCalc();
  else if(k === '%') percent();
});

/* SECTION: login */
$('btn-login').addEventListener('click', doLogin);
$('login-pwd').addEventListener('keydown', function(e){ if(e.key === 'Enter') doLogin(); });
function doLogin(){
  var id = $('login-id').value.trim();
  var pwd = $('login-pwd').value;
  var err = $('login-err');
  if(!/^\d{4,16}$/.test(id)){ err.textContent = '请输入 4–16 位数字账号 ID'; return; }
  if(!pwd){ err.textContent = '请输入密码'; return; }
  var btn = $('btn-login');
  btn.disabled = true;
  btn.textContent = '登录中…';
  rpc('calc_login', { p_id:id, p_pwd:pwd }).then(function(d){
    btn.disabled = false;
    btn.textContent = '登 录';
    if(!d.ok){ err.textContent = d.error || '登录失败'; return; }
    err.textContent = '';
    $('login-pwd').value = '';
    setSession({ uid:id, token:d.token, login_time:now(), last_active:now() });

}

/* SECTION: data-sync */
function upsertMsg(m){
  var arr = MSG[m.conv] || (MSG[m.conv] = []);
  var idx = -1;
  for(var i = 0; i < arr.length; i++){
    if(Number(arr[i].id) === Number(m.id)){ idx = i; break; }
  }
  if(idx >= 0) arr[idx] = m;
  else arr.push(m);
  arr.sort(function(a,b){ return Number(a.id) - Number(b.id); });
  if(Number(m.id) > MAX_ID) MAX_ID = Number(m.id);
}
function poll(afterId){
  if(!ME || !TOKEN || POLLING) return Promise.resolve();
  POLLING = true;
  return rpc('calc_poll', { p_token:TOKEN, p_after_id:afterId }).then(function(d){
    POLLING = false;
    if(!d.ok){ handleRpcErr(d.error); return; }
    var touched = {};
    (d.msgs || []).forEach(function(m){
      upsertMsg(m);
      touched[m.conv] = true;
    });
    if(Object.keys(touched).length){
      renderConvs();
      if(CUR_FRIEND && touched[convKey(ME, CUR_FRIEND)]) renderMsgs();
    }
  }).catch(function(e){
    POLLING = false;
    if(!/本地预览/.test(e.message)) console.warn('poll:', e.message);
  });
}
function loadFriends(){
  if(!ME || !TOKEN) return Promise.resolve();
  return rpc('calc_list_friends', { p_token:TOKEN }).then(function(d){
    if(!d.ok){ handleRpcErr(d.error); return; }
    FRIENDS = d.friends || [];
    if($('panel-friends').classList.contains('active')) renderFriends();
    renderRoomStatus();
  }).catch(function(e){
    if(!/本地预览/.test(e.message)) console.warn('friends:', e.message);
  });
}

/* SECTION: realtime-engine */
function startEngine(){
  stopEngine();
  if(!sb) return;
  HEART_TIMER = setInterval(function(){
    rpc('calc_heartbeat', { p_token:TOKEN }).then(function(d){
      if(d && !d.ok) handleRpcErr(d.error);
    }).catch(function(){});
  }, 30000);
  POLL_TIMER = setInterval(function(){ poll(MAX_ID); }, 15000);
  netCh = sb.channel('calc-net');
  netCh.on('broadcast', { event:'msg' }, function(payload){
    var p = payload || {};
    if(p.to !== ME) return;
    if(p.event === 'friend') loadFriends();
    else poll(MAX_ID);
  }).subscribe();
  lobbyCh = sb.channel('lobby', { config:{ presence:{ key:ME } } });
  lobbyCh.on('presence', { event:'sync' }, syncPresence)
    .on('presence', { event:'join' }, syncPresence)
    .on('presence', { event:'leave' }, syncPresence)
    .subscribe(function(status){
      if(status === 'SUBSCRIBED' && lobbyCh) lobbyCh.track();
    });
}
function stopEngine(){
  if(HEART_TIMER){ clearInterval(HEART_TIMER); HEART_TIMER = null; }
  if(POLL_TIMER){ clearInterval(POLL_TIMER); POLL_TIMER = null; }
  if(netCh && sb){ sb.removeChannel(netCh); netCh = null; }
  if(lobbyCh && sb){ sb.removeChannel(lobbyCh); lobbyCh = null; }
}
function syncPresence(){
  if(!lobbyCh) return;
  var state = lobbyCh.presenceState();
  ONLINE = {};
  Object.keys(state).forEach(function(k){ ONLINE[k] = true; });
  updatePresenceUI();
}
function updatePresenceUI(){
  if($('panel-friends').classList.contains('active')) renderFriends();
  renderRoomStatus();
}
function friendOnline(fid){
  if(ONLINE[fid]) return true;
  for(var i = 0; i < FRIENDS.length; i++){
    if(FRIENDS[i].id === fid && FRIENDS[i].last_seen){
      return now() - new Date(FRIENDS[i].last_seen).getTime() < 90000;
    }
  }
  return false;
}
function notifyTo(uid, event){
  if(!netCh || !uid) return;
  netCh.send({ type:'broadcast', event:'msg', payload:{ event:event, to:uid, from:ME } });
}
document.addEventListener('visibilitychange', function(){
  if(document.visibilityState === 'visible' && ME && TOKEN){
    rpc('calc_heartbeat', { p_token:TOKEN }).catch(function(){});
    poll(MAX_ID);
  }
});

/* SECTION: avatar */
var AVATAR_COLORS = ['#12b7f5','#5f8bff','#ff9d4d','#f26d8a','#10b981','#8b5cf6'];
function avatarColor(id){
  var n = 0;
  for(var i = 0; i < id.length; i++){ n = (n * 17 + id.charCodeAt(i)) >>> 0; }
  return AVATAR_COLORS[n % AVATAR_COLORS.length];
}
function avatarEl(id, avatarUrl){
  var a = document.createElement('div');
  a.className = 'avatar';
  if(avatarUrl){
    var img = document.createElement('img');
    img.src = avatarUrl;
    a.appendChild(img);
  }else{
    a.style.background = avatarColor(id);
    a.textContent = id.slice(-2);
  }
  return a;
}

/* SECTION: conv-list */
function renderConvs(){
  var list = $('conv-list');
  list.textContent = '';
  var convs = [];
  Object.keys(MSG).forEach(function(conv){
    var msgs = MSG[conv];
    if(!msgs.length) return;
    var peer = peerOf(conv);
    var friend = null;
    for(var i = 0; i < FRIENDS.length; i++){
      if(FRIENDS[i].id === peer){ friend = FRIENDS[i]; break; }
    }
    convs.push({ conv:conv, peer:peer, friend:friend, last:msgs[msgs.length-1] });
  });
  convs.sort(function(x,y){ return Number(y.last.id) - Number(x.last.id); });
  $('conv-empty').style.display = convs.length ? 'none' : '';
  convs.forEach(function(c){ list.appendChild(convItem(c)); });
}
function convItem(c){
  var name = c.friend && c.friend.nickname ? c.friend.nickname : '同学 ' + c.peer;
  var el = document.createElement('div');
  el.className = 'conv-item';
  el.appendChild(avatarEl(c.peer, c.friend && c.friend.avatar));

function renderMsgs(){
  var box = $('msg-list');
  box.textContent = '';
  var msgs = (CUR_FRIEND && MSG[convKey(ME, CUR_FRIEND)]) || [];
  var lastTs = 0;
  msgs.forEach(function(m){
    var ts = tsOf(m);
    if(ts - lastTs > 5 * 60 * 1000){
      var t = document.createElement('div');
      t.className = 'time-label';
      var s = document.createElement('span');
      s.textContent = fmtMsgTime(ts);
      t.appendChild(s);
      box.appendChild(t);
    }
    lastTs = ts;
    box.appendChild(buildMsg(m));
  });
  box.scrollTop = box.scrollHeight;
}
function buildMsg(m){
  if(m.recalled){
    var s = document.createElement('div');
    s.className = 'sys-msg';
    s.textContent = m.sender === ME ? '你撤回了一条消息' : '对方撤回了一条消息';
    return s;
  }
  var wrap = document.createElement('div');
  wrap.className = 'msg ' + (m.sender === ME ? 'self' : 'other');
  var b = document.createElement('div');
  b.className = 'bubble';
  b.textContent = m.content;
  if(m.edited_at){
    var em = document.createElement('span');
    em.className = 'edited';
    em.textContent = '已编辑';
    b.appendChild(em);
  }
  wrap.appendChild(b);
  attachMsgGesture(wrap, m);
  return wrap;
}
function attachMsgGesture(el, m){
  el.addEventListener('contextmenu', function(e){
    e.preventDefault();
    if(now() - lastTouchOpen < 800) return;
    openCtx(e.clientX, e.clientY, m);
  });
  var timer = null;
  el.addEventListener('touchstart', function(e){
    var t = e.touches[0];
    timer = setTimeout(function(){
      lastTouchOpen = now();
      openCtx(t.clientX, t.clientY, m);
    }, 460);
  }, { passive:true });
  el.addEventListener('touchmove', function(){ clearTimeout(timer); }, { passive:true });
  el.addEventListener('touchend', function(){ clearTimeout(timer); });
  el.addEventListener('touchcancel', function(){ clearTimeout(timer); });
}

/* SECTION: ctx-menu */
function openCtx(x, y, m){
  var menu = $('ctx-menu');
  menu.textContent = '';
  var items = [];
  var mine = m.sender === ME && !m.recalled;
  if(mine){
    items.push({ t:'编辑', fn:function(){ startEdit(m); } });
    if(now() - tsOf(m) <= 2 * 60 * 1000){
      items.push({ t:'撤回', fn:function(){ doRecall(m); } });
    }
  }
  if(!m.recalled){
    items.push({ t:'复制', fn:function(){ copyText(m.content); } });
  }
  items.push({ t:'删除', danger:true, fn:function(){ doDelete(m); } });
  items.forEach(function(it){
    var b = document.createElement('button');
    b.className = 'ctx-item' + (it.danger ? ' danger' : '');
    b.textContent = it.t;
    b.addEventListener('click', function(){ hideCtx(); it.fn(); });
    menu.appendChild(b);
  });
  menu.hidden = false;
  var mw = menu.offsetWidth, mh = menu.offsetHeight;
  menu.style.left = Math.max(8, Math.min(x, window.innerWidth - mw - 8)) + 'px';
  menu.style.top = Math.max(8, Math.min(y, window.innerHeight - mh - 8)) + 'px';
}
function hideCtx(){ $('ctx-menu').hidden = true; }
document.addEventListener('click', function(e){
  if(!$('ctx-menu').hidden && !e.target.closest('#ctx-menu')) hideCtx();
});
window.addEventListener('scroll', hideCtx, true);

function doRecall(m){
  rpc('calc_recall_msg', { p_token:TOKEN, p_msg_id:Number(m.id) }).then(function(d){
    if(!d.ok){ toast(d.error); return; }
    upsertMsg({
      id:m.id, conv:m.conv, sender:m.sender, recipient:m.recipient,
      content:'', created_at:m.created_at, edited_at:m.edited_at, recalled:true
    });
    renderMsgs();
    renderConvs();
    notifyTo(CUR_FRIEND, 'refresh');
  }).catch(function(e){ toast(e.message); });
}
function doDelete(m){
  rpc('calc_delete_msg', { p_token:TOKEN, p_msg_id:Number(m.id) }).then(function(d){
    if(!d.ok){ toast(d.error); return; }
    MSG[m.conv] = (MSG[m.conv] || []).filter(function(x){
      return Number(x.id) !== Number(m.id);
    });
    renderMsgs();
    renderConvs();
    notifyTo(CUR_FRIEND, 'refresh');
  }).catch(function(e){ toast(e.message); });
}
function copyText(text){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(
      function(){ toast('已复制'); },
      function(){ fallbackCopy(text); }
    );
  }else fallbackCopy(text);
}
function fallbackCopy(text){
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try{ document.execCommand('copy'); toast('已复制'); }
  catch(e){ toast('复制失败，请长按手动复制'); }
  document.body.removeChild(ta);
}
function startEdit(m){
  EDIT_ID = Number(m.id);
  $('edit-banner').hidden = false;
  var inp = $('msg-input');
  inp.value = m.content;
  inp.focus();
}
$('edit-cancel').addEventListener('click', function(){
  EDIT_ID = null;
  $('edit-banner').hidden = true;
  $('msg-input').value = '';
});

/* SECTION: send */
function sendMsg(){
  var inp = $('msg-input');
  var text = inp.value.trim();
  if(!text || !CUR_FRIEND || !ME) return;
  inp.disabled = true;
  var promise;
  if(EDIT_ID){
    var editId = EDIT_ID;
    promise = rpc('calc_edit_msg', { p_token:TOKEN, p_msg_id:editId, p_content:text }).then(function(d){
      if(!d.ok) throw new Error(d.error);
      upsertMsg(d.msg);
      EDIT_ID = null;
      $('edit-banner').hidden = true;
    });
  }else{
    promise = rpc('calc_send_msg', { p_token:TOKEN, p_to:CUR_FRIEND, p_content:text }).then(function(d){
      if(!d.ok) throw new Error(d.error);
      upsertMsg(d.msg);
    });
  }
  promise.then(function(){
    inp.value = '';
    inp.disabled = false;
    inp.focus();
    renderMsgs();
    renderConvs();
    notifyTo(CUR_FRIEND, 'refresh');
  }).catch(function(e){
    inp.disabled = false;
    toast(e.message);
  });
}
$('btn-send').addEventListener('click', sendMsg);
$('msg-input').addEventListener('keydown', function(e){
  if(e.key === 'Enter'){ e.preventDefault(); sendMsg(); }
});

function showProfile(uid, profileData){
  if(profileData){
    renderProfileView(uid, profileData);
    $('profile-overlay').classList.add('active');
    return;
  }
  rpc('calc_get_profile', { p_token:TOKEN, p_target_id:uid }).then(function(d){
    if(!d.ok){ toast(d.error); return; }
    renderProfileView(uid, d.profile);
    $('profile-overlay').classList.add('active');
  }).catch(function(e){ toast(e.message); });
}
function renderProfileView(uid, p){
  var av = $('profile-avatar');
  av.innerHTML = '';
  if(p.avatar){
    var img = document.createElement('img');
    img.src = p.avatar;
    av.appendChild(img);
  }else{
    av.textContent = uid.slice(-2);
    av.style.background = avatarColor(uid);
  }
  var nickname = p.nickname || '同学 ' + uid;
  $('profile-nickname').textContent = nickname;
  $('profile-id').textContent = 'ID：' + uid;
  var details = $('profile-details');
  details.textContent = '';
  if(p.birthday){
    addProfileRow(details, '生日', p.birthday);
    var age = calcAge(p.birthday);
    if(age !== null) addProfileRow(details, '年龄', age + ' 岁');
    var zodiac = calcZodiac(p.birthday);
    if(zodiac) addProfileRow(details, '星座', zodiac);
  }
  if(p.gender){
    addProfileRow(details, '性别', p.gender);
  }
  var actions = $('profile-actions');
  actions.textContent = '';
  if(!p.is_self){
    if(p.is_friend){
      var btnMsg = document.createElement('button');
      btnMsg.className = 'btn-send-msg';
      btnMsg.textContent = '发消息';
      btnMsg.addEventListener('click', function(){
        $('profile-overlay').classList.remove('active');
        showTab('chat');
        openChat(uid);
      });
      actions.appendChild(btnMsg);
    }else{
      var btnAdd = document.createElement('button');
      btnAdd.className = 'btn-add-friend';
      btnAdd.textContent = '加好友';
      btnAdd.addEventListener('click', function(){
        btnAdd.disabled = true;
        btnAdd.textContent = '添加中…';
        rpc('calc_add_friend', { p_token:TOKEN, p_friend_id:uid }).then(function(d){
          if(!d.ok){ toast(d.error); btnAdd.disabled = false; btnAdd.textContent = '加好友'; return; }
          toast('已添加 同学 ' + uid);
          notifyTo(uid, 'friend');
          loadFriends().then(function(){
            actions.textContent = '';
            var btnMsg2 = document.createElement('button');
            btnMsg2.className = 'btn-send-msg';
            btnMsg2.textContent = '发消息';
            btnMsg2.addEventListener('click', function(){
              $('profile-overlay').classList.remove('active');
              showTab('chat');
              openChat(uid);
            });
            actions.appendChild(btnMsg2);
          });
        }).catch(function(e){ toast(e.message); btnAdd.disabled = false; btnAdd.textContent = '加好友'; });
      });
      actions.appendChild(btnAdd);
    }
  }
}

$('ep-avatar').addEventListener('click', function(){ $('ep-avatar-input').click(); });
$('ep-avatar-input').addEventListener('change', function(e){
  var file = e.target.files[0];
  if(!file) return;
  if(file.size > 200000){ toast('头像文件太大，请选择 200KB 以内的图片'); return; }
  var reader = new FileReader();
  reader.onload = function(ev){
    EP_AVATAR = ev.target.result;
    renderEpAvatar();
  };
  reader.readAsDataURL(file);
});
document.querySelectorAll('.ep-gender-group button').forEach(function(b){
  b.addEventListener('click', function(){
    EP_GENDER = b.dataset.gender;
    document.querySelectorAll('.ep-gender-group button').forEach(function(x){
      x.classList.toggle('on', x.dataset.gender === EP_GENDER);
    });
  });
});
$('ep-back').addEventListener('click', function(){ $('edit-profile-overlay').classList.remove('active'); });
$('ep-save').addEventListener('click', function(){
  var nickname = $('ep-nickname').value.trim();
  var birthday = $('ep-birthday').value || null;
  rpc('calc_update_profile', {
    p_token:TOKEN, p_nickname:nickname, p_birthday:birthday,
    p_gender:EP_GENDER, p_avatar:EP_AVATAR || ''
  }).then(function(d){
    if(!d.ok){ toast(d.error); return; }
    toast('资料已保存');
    $('edit-profile-overlay').classList.remove('active');
    loadProfile().then(function(){ renderMe(); renderFriends(); renderConvs(); });
  }).catch(function(e){ toast(e.message); });
});

/* SECTION: change-pwd */
$('row-change-pwd').addEventListener('click', function(){ $('pwd-overlay').classList.add('active'); });
$('pwd-back').addEventListener('click', function(){ $('pwd-overlay').classList.remove('active'); });
$('btn-chpwd').addEventListener('click', function(){
  var old = $('pwd-old').value;
  var nw = $('pwd-new').value;
  var nw2 = $('pwd-new2').value;
  if(nw.length < 4){ toast('新密码至少 4 位'); return; }
  if(nw !== nw2){ toast('两次输入的新密码不一致'); return; }
  rpc('calc_change_pwd', { p_token:TOKEN, p_old:old, p_new:nw }).then(function(d){
    if(!d.ok){ toast(d.error); return; }
    $('pwd-old').value = '';
    $('pwd-new').value = '';
    $('pwd-new2').value = '';
    $('pwd-overlay').classList.remove('active');
    toast('密码修改成功，请牢记新密码');
  }).catch(function(e){ toast(e.message); });
});

/* SECTION: me */
$('btn-logout').addEventListener('click', function(){
  var t = TOKEN;
  stopEngine();
  clearSession();
  ME = null; TOKEN = null; MY_PROFILE = null;
  MSG = {}; MAX_ID = 0; FRIENDS = []; ONLINE = {};
  CUR_FRIEND = null; EDIT_ID = null;
  $('login-id').value = '';
  $('login-pwd').value = '';
  showScreen('login');
  toast('已退出登录');
  if(t) rpc('calc_logout', { p_token:t }).catch(function(){});
});
function applyTheme(t){
  document.documentElement.setAttribute('data-theme', t);
  jset('oc_theme', t);
  $('theme-light').classList.toggle('on', t === 'light');
  $('theme-dark').classList.toggle('on', t === 'dark');
}
$('theme-light').addEventListener('click', function(){ applyTheme('light'); });
$('theme-dark').addEventListener('click', function(){ applyTheme('dark'); });
$('row-about').addEventListener('click', function(){
  toast('在线计算器 v1.2.0 · 简洁好用的计算工具');
});

/* SECTION: init */
applyTheme(jget('oc_theme') || 'light');
renderCalc();
showScreen('calc');
})();
</script>
</body>
</html>
